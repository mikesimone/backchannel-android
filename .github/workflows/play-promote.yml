# BACKCHANNEL: moves the newest closed-testing release to production (or
# another track) and sends it for review. Run only when Mike says to go public.
name: Play promote

on:
  workflow_dispatch:
    inputs:
      from_track:
        description: "Track to promote from"
        default: alpha
      to_track:
        description: "Track to promote to"
        default: production
      rollout:
        description: "Staged rollout fraction (0.01-1.0); 1.0 = everyone"
        default: "1.0"

permissions: {}

jobs:
  promote:
    name: Promote
    runs-on: ubuntu-24.04
    steps:
      - name: Promote on Play
        shell: bash
        run: |
          set -o pipefail
          gem install fastlane --no-document --user-install
          export PATH="$(ruby -e 'print Gem.user_dir')/bin:$PATH"
          printenv PLAY_JSON > play.json
          trap 'rm -f play.json' EXIT
          args=()
          if [ "$ROLLOUT" != "1.0" ] && [ "$ROLLOUT" != "1" ]; then
            args=(--rollout "$ROLLOUT" --release_status inProgress)
          else
            args=(--release_status completed)
          fi
          fastlane supply \
            --json_key play.json \
            --package_name net.mikesimone.backchannel \
            --track "$FROM_TRACK" \
            --track_promote_to "$TO_TRACK" \
            --skip_upload_apk true --skip_upload_aab true \
            --skip_upload_metadata true --skip_upload_images true \
            --skip_upload_screenshots true --skip_upload_changelogs true \
            "${args[@]}"
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          FROM_TRACK: ${{ inputs.from_track }}
          TO_TRACK: ${{ inputs.to_track }}
          ROLLOUT: ${{ inputs.rollout }}
