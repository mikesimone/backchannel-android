# BACKCHANNEL: moves the newest closed-testing release to production (or
# another track) and sends it for review. Run only when Mike says to go public.
name: Play promote

on:
  workflow_dispatch:
    inputs:
      from_track:
        description: "Track to promote from"
        default: alpha
      to_track:
        description: "Track to promote to"
        default: production
      rollout:
        description: "Staged rollout fraction (0.01-1.0); 1.0 = everyone"
        default: "1.0"

permissions: {}

jobs:
  promote:
    name: Promote
    runs-on: ubuntu-24.04
    steps:
      - name: Promote on Play
        shell: bash
        run: |
          set -o pipefail
          gem install fastlane --no-document --user-install
          export PATH="$(ruby -e 'print Gem.user_dir')/bin:$PATH"
          printenv PLAY_JSON > play.json
          trap 'rm -f play.json' EXIT
          args=()
          if [ "$ROLLOUT" != "1.0" ] && [ "$ROLLOUT" != "1" ]; then
            args=(--rollout "$ROLLOUT" --release_status inProgress)
          else
            args=(--release_status completed)
          fi
          fastlane supply \
            --json_key play.json \
            --package_name net.mikesimone.backchannel \
            --track "$FROM_TRACK" \
            --track_promote_to "$TO_TRACK" \
            --skip_upload_apk true --skip_upload_aab true \
            --skip_upload_metadata true --skip_upload_images true \
            --skip_upload_screenshots true --skip_upload_changelogs true \
            "${args[@]}"
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          FROM_TRACK: ${{ inputs.from_track }}
          TO_TRACK: ${{ inputs.to_track }}
          ROLLOUT: ${{ inputs.rollout }}

      # BACKCHANNEL (Mike 2026-11-23): store-listing text changes go to Google only together
      # with a production release, never before. Upload it right after promoting to production.
      - uses: actions/checkout@v6
        if: inputs.to_track == 'production'

      - uses: actions/setup-python@v5
        if: inputs.to_track == 'production'
        with:
          python-version: "3.12"

      - name: Upload store listing with the production release
        if: inputs.to_track == 'production'
        run: |
          python3 -m pip install --quiet google-api-python-client==2.154.0 google-auth==2.36.0
          printenv PLAY_JSON > "$RUNNER_TEMP/play.json"
          trap 'rm -f "$RUNNER_TEMP/play.json"' EXIT
          PLAY_JSON="$RUNNER_TEMP/play.json" python3 backchannel/play_listing.py
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
