# BACKCHANNEL: push the store listing (fastlane/metadata/android) to Google
# Play without a new build. Needs the PLAY_SERVICE_ACCOUNT_JSON secret.
name: Play listing

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "fastlane/metadata/**"

permissions:
  contents: read

jobs:
  listing:
    name: Update store listing
    runs-on: ubuntu-24.04
    env:
      HAVE_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        if: "env.HAVE_PLAY == 'true'"
        with:
          python-version: "3.12"

      - name: Upload listing
        if: "env.HAVE_PLAY == 'true'"
        run: |
          python3 -m pip install --quiet google-api-python-client==2.154.0 google-auth==2.36.0
          printenv PLAY_JSON > "$RUNNER_TEMP/play.json"
          trap 'rm -f "$RUNNER_TEMP/play.json"' EXIT
          PLAY_JSON="$RUNNER_TEMP/play.json" python3 backchannel/play_listing.py
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Skipped
        if: "env.HAVE_PLAY != 'true'"
        run: echo "PLAY_SERVICE_ACCOUNT_JSON is not set; nothing uploaded."
